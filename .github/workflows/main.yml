name: Python Test

on: 
  push:
    branches: [ main ]
  pull_request:


jobs: 
   test:
     runs-on: ubuntu-latest


     steps:
       - name: Check out code
         uses: actions/checkout@v4

       - name: Python version
         uses: actions/setup-python@v5
         with:
           python-version: "3.10"

       - name: Install dependencies
         run: |
            python -m pip insatll --upgrade pip install pytest

       - name: Run tests
         run: pytest
